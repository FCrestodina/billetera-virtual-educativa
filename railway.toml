[build]
builder = "NIXPACKS"
# Sin install: nixpacks ya instala en su propia fase, y desde que el lockfile
# se trackea (2026-09-01) elige `npm ci` solo -> el deploy ya es reproducible.
# NO poner `npm ci` aca: nixpacks monta un cache en /app/node_modules/.cache y
# `npm ci` arranca borrando node_modules, que falla con EBUSY sobre ese mount.
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "web"
