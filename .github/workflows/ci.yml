name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # El typecheck va explicito y NO se delega al build: el alcance del
      # typecheck de `next build` es una decision del framework y cambia entre
      # versiones. El 2026-09-01, el bump a Next 16.3 amplio ese alcance y
      # destapo 32 errores TS2352 en los mocks de drizzle que llevaban meses
      # en el repo sin que nada los mirara.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Gatea desde el 2026-09-01, cuando se arreglaron los 4 errores de
      # react-hooks/set-state-in-effect que lo tenian en rojo. Hoy sale en 0
      # errores y 0 warnings: cualquier cosa que aparezca es nueva.
      - name: Lint
        run: npm run lint
